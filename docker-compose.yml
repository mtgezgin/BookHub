# docker-compose.yml — DEV stack'i (Faz 2: Postgres; Faz 7: Redis; Faz 8: API; Faz 11: NGINX).
#
# NE İŞE YARAR: "docker compose up -d" tek komutla dev veritabanını ayağa kaldırır.
# API bu fazda hâlâ host'ta "go run" ile çalışır (hızlı feedback döngüsü);
# API'nin kendisini container'a almak Faz 8'in konusu.
#
# NEDEN DOCKER: Postgres'i makineye "kurmak" yerine izole, tek komutla açılır/kapanır,
# silinip baştan kurulabilir (disposable) bir kopya çalıştırıyoruz. Prod'da bu container
# YOK — orada Supabase var; kod sadece DATABASE_URL env'i ile ikisi arasında geçiş yapar.

# Compose "proje adı" — volume/network isimlerine önek olur (ör. bookhub_pg_data).
# Vermezsek klasör adından türetirdi; açık yazmak öngörülebilirlik sağlar.
name: bookhub

services:
  # "postgres" = servis adı. Compose network'ünde aynı zamanda DNS hostname olur
  # (başka bir container ona "postgres:5432" diye erişebilir — Faz 8'de işe yarayacak).
  postgres:
    # İmaj = çalıştırılacak yazılımın hazır paketi. "postgres:16" = resmî Postgres,
    # major sürüm 16'ya pinli (sadece "postgres" yazsak her "up"ta sürüm değişebilirdi).
    image: postgres:16

    # Container'a sabit isim — "docker exec bookhub-postgres ..." gibi komutlar kolaylaşır.
    container_name: bookhub-postgres

    # İlk açılışta veritabanını bu değerlerle kurar (superuser + şifre + default DB).
    # Bunlar SADECE dev içindir; gerçek gizli değerler asla compose dosyasına yazılmaz.
    environment:
      POSTGRES_USER: bookhub
      POSTGRES_PASSWORD: bookhub_dev # dev-only — prod DSN'i Supabase/secret store'da yaşar
      POSTGRES_DB: bookhub

    # Port yayını: "host_ip:host_port:container_port". Başındaki 127.0.0.1 ÖNEMLİ:
    # yazmazsak Docker 0.0.0.0'a bağlar → aynı Wi-Fi/LAN'daki herkes (şifresi repoda
    # yazan!) dev DB'ne erişebilirdi. 127.0.0.1 = sadece bu makine (go run, psql, pgAdmin).
    ports:
      - "127.0.0.1:5432:5432"

    # Named volume: container SİLİNSE bile veri kalır (container'ın kendi dosya sistemi
    # geçicidir). /var/lib/postgresql/data = Postgres'in veri dizini.
    volumes:
      - pg_data:/var/lib/postgresql/data

    # Healthcheck: "container ayakta" ≠ "Postgres bağlantı kabul ediyor". pg_isready
    # gerçek hazırlığı yoklar; ileride API container'ı "depends_on: condition:
    # service_healthy" ile buna yaslanacak (Faz 8).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookhub -d bookhub"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Redis (Faz 7): cache + çok-instance rate limit sayaçları. Kalıcılık KAPALI (--save ""
  # --appendonly no): içindeki her şey Postgres'ten yeniden üretilebilir ya da zaten kısa
  # ömürlü (sayaçlar). Redis'i "ikinci bir veritabanı" gibi değil, atılabilir bir hızlandırıcı
  # gibi kullanıyoruz — kaybolursa uygulama yavaşlar ama DOĞRU çalışmaya devam eder.
  # maxmemory + allkeys-lru: bellek dolarsa en az kullanılan anahtarı at (cache için doğru politika).
  redis:
    image: redis:7-alpine
    container_name: bookhub-redis
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    # Host portu 6380: bu makinede 6379'u başka bir projenin Redis'i kullanıyor. Container
    # İÇİNDE port hâlâ 6379 — değişen yalnız host tarafı ("host:container" eşlemesi bunun için var).
    # 127.0.0.1: Postgres'teki gibi yalnız bu makine — şifresiz Redis'i LAN'a açma.
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # API (Faz 8) — "app" PROFİLİNDE: düz "docker compose up -d" yalnızca altyapıyı
  # (Postgres + Redis) kaldırır ve API'yi host'ta "go run" ile hızlı döngüde geliştirirsin.
  # Tüm uygulamayı konteynerde görmek için: docker compose --profile app up -d --build
  api:
    profiles: ["app"]
    build: ./backend
    image: bookhub-api:dev
    container_name: bookhub-api
    environment:
      PORT: "8080"
      # Konteyner İÇİNDEN "localhost" API'nin kendisi demektir; DB'ye servis adıyla gidilir
      # (compose ağında "postgres" ve "redis" birer DNS adıdır) ve konteyner portuyla (6379).
      DATABASE_URL: postgres://bookhub:bookhub_dev@postgres:5432/bookhub?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      # Sır compose dosyasına YAZILMAZ: compose, repo kökündeki .env'den okur (git dışı).
      # Tanımlı değilse "up" burada, anlaşılır bir mesajla durur.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET gerekli - .env.example'i .env olarak kopyala}
      AUTO_MIGRATE: "true"
      LOG_FORMAT: json
      # X-Real-IP'ye YALNIZCA NGINX konteynerinin sabit adresinden gelen isteklerde güven.
      TRUSTED_PROXIES: 172.28.0.10
    ports:
      - "127.0.0.1:8080:8080"
    # "container başladı" değil "Postgres bağlantı kabul ediyor" + "Redis PONG" bekle.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Web (Faz 11): NGINX — derlenmiş frontend + /api reverse proxy, TEK origin.
  # Tüm uygulama: http://localhost:3000
  web:
    profiles: ["app"]
    build: ./frontend
    image: bookhub-web:dev
    container_name: bookhub-web
    ports:
      - "127.0.0.1:3000:8080" # konteynerde root olmayan NGINX 8080'de dinler
    # Sabit adres: API, X-Real-IP başlığına yalnızca bu adresten gelen isteklerde güvenir.
    networks:
      default:
        ipv4_address: 172.28.0.10
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

# Varsayılan ağ için SABİT alt ağ: NGINX'e sabit IP verebilmek (ve API'nin güveneceği adresi
# yapılandırmada yazabilmek) için gerekli. Bu aralık Docker'ın iç ağıdır, dışarıya açık değil.
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16

# Named volume'ların bildirimi. Veriyi sıfırlamak istersen:
# "docker compose down -v" (-v volume'u da siler → taze DB).
volumes:
  pg_data:
