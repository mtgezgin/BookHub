# docker-compose.yml — DEV altyapı stack'i (Faz 2: Postgres; Faz 7'de Redis eklenecek).
#
# NE İŞE YARAR: "docker compose up -d" tek komutla dev veritabanını ayağa kaldırır.
# API bu fazda hâlâ host'ta "go run" ile çalışır (hızlı feedback döngüsü);
# API'nin kendisini container'a almak Faz 8'in konusu.
#
# NEDEN DOCKER: Postgres'i makineye "kurmak" yerine izole, tek komutla açılır/kapanır,
# silinip baştan kurulabilir (disposable) bir kopya çalıştırıyoruz. Prod'da bu container
# YOK — orada Supabase var; kod sadece DATABASE_URL env'i ile ikisi arasında geçiş yapar.

# Compose "proje adı" — volume/network isimlerine önek olur (ör. bookhub_pg_data).
# Vermezsek klasör adından türetirdi; açık yazmak öngörülebilirlik sağlar.
name: bookhub

services:
  # "postgres" = servis adı. Compose network'ünde aynı zamanda DNS hostname olur
  # (başka bir container ona "postgres:5432" diye erişebilir — Faz 8'de işe yarayacak).
  postgres:
    # İmaj = çalıştırılacak yazılımın hazır paketi. "postgres:16" = resmî Postgres,
    # major sürüm 16'ya pinli (sadece "postgres" yazsak her "up"ta sürüm değişebilirdi).
    image: postgres:16

    # Container'a sabit isim — "docker exec bookhub-postgres ..." gibi komutlar kolaylaşır.
    container_name: bookhub-postgres

    # İlk açılışta veritabanını bu değerlerle kurar (superuser + şifre + default DB).
    # Bunlar SADECE dev içindir; gerçek gizli değerler asla compose dosyasına yazılmaz.
    environment:
      POSTGRES_USER: bookhub
      POSTGRES_PASSWORD: bookhub_dev # dev-only — prod DSN'i Supabase/secret store'da yaşar
      POSTGRES_DB: bookhub

    # Port yayını: "host:container". Container içindeki 5432'yi host'taki 5432'ye bağlar
    # ki host'ta çalışan API (go run) ve psql "localhost:5432" ile erişebilsin.
    ports:
      - "5432:5432"

    # Named volume: container SİLİNSE bile veri kalır (container'ın kendi dosya sistemi
    # geçicidir). /var/lib/postgresql/data = Postgres'in veri dizini.
    volumes:
      - pg_data:/var/lib/postgresql/data

    # Healthcheck: "container ayakta" ≠ "Postgres bağlantı kabul ediyor". pg_isready
    # gerçek hazırlığı yoklar; ileride API container'ı "depends_on: condition:
    # service_healthy" ile buna yaslanacak (Faz 8).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookhub -d bookhub"]
      interval: 5s
      timeout: 3s
      retries: 5

# Named volume'ların bildirimi. Veriyi sıfırlamak istersen:
# "docker compose down -v" (-v volume'u da siler → taze DB).
volumes:
  pg_data:
