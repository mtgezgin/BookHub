# sqlc.yaml — sqlc'nin yapılandırması (Faz 2, adım 4).
#
# SQLC NE YAPAR: sql/queries/*.sql içindeki EL YAZMASI sorguları okur, migrations/'taki
# şemaya karşı DOĞRULAR (kolon adı yanlışsa üretim ANINDA hata — runtime'da değil!) ve
# her sorgu için tip-güvenli Go fonksiyonu üretir. ORM değil: SQL'i sen yazarsın,
# sqlc sadece rows.Scan/param boilerplate'ini üretir.
#
# İKİ SQL KLASÖRÜNÜ KARIŞTIRMA (§18.4):
#   migrations/   = goose'un şema tarihi (CREATE TABLE...)  → sqlc bunu sadece OKUR
#   sql/queries/  = sqlc'nin girdisi (SELECT/INSERT...)     → üretimin kaynağı

version: "2"
sql:
  - engine: "postgresql"
    # El yazması sorgular (girdi):
    queries: "sql/queries"
    # Şema kaynağı: goose migration'larını doğrudan okur; "-- +goose Down" bölümlerini
    # akıllıca yok sayar. Yani şemayı İKİNCİ kez tanımlamıyoruz — tek gerçek: migrations/.
    schema: "migrations"
    gen:
      go:
        package: "db"            # üretilen paketin adı  → import edince db.GetApprovedBook(...)
        out: "internal/db"       # üretilen dosyaların yeri (commit'lenir — build sqlc istemesin)
        sql_package: "pgx/v5"    # pgx sürücüsüyle çalışan kod üret (database/sql değil)
        emit_json_tags: true     # struct alanlarına `json:"..."` etiketi (handler'da işe yarar)
        overrides:
          # timestamptz → time.Time: tüm timestamptz kolonlarımız NOT NULL olduğu için
          # pgtype.Timestamptz sarmalayıcısına gerek yok; düz time.Time hem doğal hem
          # JSON'a "2026-07-05T..." olarak temiz serileşir.
          - db_type: "timestamptz"
            go_type: "time.Time"
          # NULL olabilen sayılar → *int32 (pointer): NULL = nil. Pointer'sız bırakırsak
          # pgtype.Int4 üretirdi ({Int32,Valid} — JSON'da çirkin). NULL'un Go karşılığını
          # migration'da bilerek seçmiştik; burada da ucunu bağlıyoruz.
          - column: "books.publication_year"
            go_type:
              type: "int32"
              pointer: true
          - column: "books.page_count"
            go_type:
              type: "int32"
              pointer: true
          # Faz 4: NULL olabilen FK'ler ve zaman → pointer (nil = yok).
          - column: "books.submitted_by"
            go_type:
              type: "int64"
              pointer: true
          - column: "books.moderated_by"
            go_type:
              type: "int64"
              pointer: true
          - column: "books.moderated_at"
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - column: "audit_logs.actor_id"
            go_type:
              type: "int64"
              pointer: true
          # Faz 5: NUMERIC ortalama → *float64 (NULL = henüz puan yok). Saklama ve SIRALAMA
          # DB'de NUMERIC ile kesin; Go tarafı yalnızca gösterim için okuyor. Override olmasa
          # pgtype.Numeric üretirdi (JSON'da {"Int":…,"Exp":…} gibi okunmaz bir nesne).
          - column: "books.average_rating"
            go_type:
              type: "float64"
              pointer: true
          - db_type: "pg_catalog.numeric"
            nullable: true
            go_type:
              type: "float64"
              pointer: true
          # NULL olabilen her zaman damgası (moderated_at, deleted_at) → *time.Time.
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          # NULL olabilen her bigint (FK'ler, VIEW kolonları) → *int64.
          - db_type: "pg_catalog.int8"
            nullable: true
            go_type:
              type: "int64"
              pointer: true
          # NULL olabilen integer (Faz 16: editions ve book_view'daki yıl / sayfa) → *int32; nil =
          # bilinmiyor. Kolon bazlı kurallar (books.*) yukarıda; bu genel kural yeni tablolarda
          # ve görünümlerde tek tek kolon yazmayı gereksiz kılar.
          - db_type: "pg_catalog.int4"
            nullable: true
            go_type:
              type: "int32"
              pointer: true
          # NULL olabilen smallint (Faz 15: LEFT JOIN'den gelen "puanım") → *int16; nil = puan yok.
          - db_type: "pg_catalog.int2"
            nullable: true
            go_type:
              type: "int16"
              pointer: true
          # jsonb → json.RawMessage: DB'deki JSON, cevaba yeniden kodlanmadan AYNEN gömülür
          # ([]byte olsaydı encoding/json onu base64 string'e çevirirdi).
          - db_type: "jsonb"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          # NULL olabilen metin (sqlc.narg parametreleri ve nullable text kolonlar) →
          # *string. Override olmasa pgtype.Text ({String, Valid}) üretirdi — JSON'da çirkin.
          - db_type: "text"
            nullable: true
            go_type:
              type: "string"
              pointer: true
