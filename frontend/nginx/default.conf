# BookHub NGINX (Faz 11): statik frontend + /api reverse proxy, TEK origin.
#
# Tarayıcı açısından her şey aynı adresten gelir → CORS gerekmez, çerez/kimlik karmaşası yok.

# Kaba kuvvete karşı İKİNCİ katman (API'nin kendi rate limit'ine ek): IP başına dakikada
# 20 kimlik isteği. conf.d dosyaları http bağlamında include edildiği için zone burada tanımlanır.
limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off; # hata sayfalarında NGINX sürümünü gösterme

    include /etc/nginx/snippets/security-headers.conf;

    # NGINX'in KENDİ sağlığı (API'ye gitmez) — konteyner healthcheck'i için.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # API'nin sağlığı ön kapıdan da görülebilsin (yük dengeleyici / uptime izleyici için).
    # /healthz = NGINX'in kendisi, /health = arkasındaki API.
    location = /health {
        include /etc/nginx/snippets/api-proxy.conf;
    }

    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    location /api/ {
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # Vite dosya adlarına içerik hash'i koyar (index-BM18by0l.js): içerik değişirse ad da
    # değişir → bu dosyalar sonsuza dek cache'lenebilir.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SPA: /books/42 gibi rotalar sunucuda dosya değil — index.html dönülür, yönlendirmeyi
    # React Router yapar. index.html asla cache'lenmez (yeni sürümün hash'li dosyalarını göstersin).
    location / {
        try_files $uri /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
