# BookHub NGINX (Faz 11): statik frontend + /api reverse proxy, TEK origin.
#
# Tarayıcı açısından her şey aynı adresten gelir → CORS gerekmez, çerez/kimlik karmaşası yok.

# Kaba kuvvete karşı İKİNCİ katman (API'nin kendi rate limit'ine ek): IP başına dakikada
# 20 kimlik isteği. conf.d dosyaları http bağlamında include edildiği için zone burada tanımlanır.
limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;

# Parola değiştirme (Faz 13) için AYRI kova: login|register ile PAYLAŞMAZ. NEDEN: çalınmış
# bir access token'la (15 dk geçerli) mevcut parolayı kaba kuvvetle deneyen biri, kurbanın
# giriş kotasını da yiyip onu dışarıda bırakmasın; tersine, normal giriş trafiği de parola
# değiştirmeyi kilitlemesin. Daha sıkı (dakikada 10, anında en fazla 6 istek): bu uç nadiren
# çağrılır, API'nin kendi "password" kovası ikinci katmandır.
limit_req_zone $binary_remote_addr zone=password:10m rate=10r/m;

# API'ye iletilecek Host: istemcinin gönderdiği başlık PORTUYLA ($http_host — nedeni
# api-proxy.conf'ta). İstemci hiç Host göndermediyse (HTTP/1.0) $http_host boştur ve NGINX
# başlığı hiç iletmez → Go 400 dönerdi (/health dahil); o durumda $host'a (server_name) düş.
map $http_host $api_host {
    ""      $host;
    default $http_host;
}

server {
    listen 8080; # root olmayan kullanıcı 1024 altına bağlanamaz (bkz. Dockerfile)
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off; # hata sayfalarında NGINX sürümünü gösterme

    include /etc/nginx/snippets/security-headers.conf;

    # NGINX'in KENDİ sağlığı (API'ye gitmez) — konteyner healthcheck'i için.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # API'nin sağlığı ön kapıdan da görülebilsin (yük dengeleyici / uptime izleyici için).
    # /healthz = NGINX'in kendisi, /health = arkasındaki API.
    location = /health {
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # Sınır YALNIZCA kimlik bilgisi alan uçlarda (login, register). İlk sürüm tüm /api/auth/'u
    # kapsıyordu: her sayfa açılışındaki /me ve /refresh aynı bütçeyi yiyor, 429 alan /refresh
    # kullanıcıyı oturumdan atıyordu (review bulgusu F10 + F3).
    # Regex location, /api/ önekinden ÖNCE değerlendirilir.
    #
    # DİKKAT (bir yük dengeleyicinin arkasında): $binary_remote_addr o zaman dengeleyicinin
    # adresidir → sınır TÜM kullanıcılar için ortak olur. Gerçek istemci adresi için:
    #   set_real_ip_from <dengeleyici CIDR>;  real_ip_header X-Forwarded-For;
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # Parola değiştirme: kendi kovası (zone=password, nedeni yukarıda). Tam eşleşme (=) regex
    # location'lardan önce seçilir, yani bu yol login|register kovasına hiç uğramaz.
    location = /api/auth/password {
        limit_req zone=password burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    location /api/ {
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # Vite dosya adlarına içerik hash'i koyar (index-BM18by0l.js): içerik değişirse ad da
    # değişir → bu dosyalar sonsuza dek cache'lenebilir.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SPA: /books/42 gibi rotalar sunucuda dosya değil — index.html dönülür, yönlendirmeyi
    # React Router yapar. index.html asla cache'lenmez (yeni sürümün hash'li dosyalarını göstersin).
    location / {
        try_files $uri /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
