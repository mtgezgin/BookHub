# Güvenlik başlıkları — her add_header içeren bloğa AYRICA include edilir.
#
# NGINX TUZAĞI: bir location bloğunda TEK bir add_header bile yazarsan, server seviyesindeki
# bütün add_header'lar o location için SESSİZCE düşer (miras alınmaz). Başlıkları tek dosyada
# tutup her yere include etmek bu yüzden.

# CSP: yalnız kendi origin'imizden script/stil/istek. Kitap kapakları başka sitelerden
# gelebilir (img-src https:). 'unsafe-inline' YALNIZ stil için: histogram çubukları satır içi
# style="height:…" kullanıyor. Script için asla — XSS'e karşı asıl duvar bu.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
