# /api isteklerini Go API konteynerine iletir.
proxy_pass http://api:8080;
proxy_http_version 1.1;
proxy_set_header Host $host;
# İstemcinin gerçek IP'si. $remote_addr NGINX'in GÖRDÜĞÜ adres; istemcinin gönderdiği bir
# X-Real-IP varsa bu satır onu EZER — sahte IP proxy'den geçemez. API bu başlığa yalnızca
# NGINX'in adresinden gelen isteklerde güvenir (TRUSTED_PROXIES).
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 15s;
client_max_body_size 1m; # API'nin 1 MiB gövde sınırıyla aynı: büyük gövde API'ye hiç ulaşmasın
