# /api isteklerini Go API konteynerine iletir.
proxy_pass http://api:8080;
proxy_http_version 1.1;
# Host: tarayıcının gönderdiği Host başlığı OLDUĞU GİBİ ($http_host), yani PORTUYLA birlikte.
# NEDEN $host değil: $host portu DÜŞÜRÜR (localhost:3000 → localhost). API'deki CSRF koruması
# (http.CrossOriginProtection) Sec-Fetch-Site göndermeyen tarayıcıda (eski tarayıcı ya da düz
# HTTP'deki, localhost olmayan bir origin) Origin'in host:port'unu Host ile karşılaştırır →
# "localhost:3000" ≠ "localhost" olur ve MEŞRU istek 403 alırdı (denendi).
# Değer istemciden gelir ama sahtesi bir şey kazandırmaz: tarayıcı Host'u JS'e yazdırmaz, başlığı
# elle yazan bir istemcinin (curl) ise atlatacağı bir CSRF zaten yok.
# ($api_host = $http_host; istemci Host göndermediyse $host — map, default.conf'ta.)
proxy_set_header Host $api_host;
# İstemcinin gerçek IP'si. $remote_addr NGINX'in GÖRDÜĞÜ adres; istemcinin gönderdiği bir
# X-Real-IP varsa bu satır onu EZER — sahte IP proxy'den geçemez. API bu başlığa yalnızca
# NGINX'in adresinden gelen isteklerde güvenir (TRUSTED_PROXIES).
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 15s;
client_max_body_size 1m; # API'nin 1 MiB gövde sınırıyla aynı: büyük gövde API'ye hiç ulaşmasın
