# CI — her push/PR'da: backend (birim + gerçek Postgres/Redis entegrasyon testleri + lint),
# frontend (tip kontrolü + test + build), imaj taraması (Trivy) ve uçtan uca (tüm stack
# konteynerde + MVP smoke).
# Bu, lokalde yaptığımız kontrollerin sunucudaki güvenlik ağı hâlidir.
# Ayrıca: rules.yml (Kurallar, yol filtresiz) ve deploy.yml (main'de CI yeşilse yayın).
name: CI

on:
  # İKİ LİSTE AYNI KALMALI: push (main) ile pull_request farklı davranırsa, PR'da hiç
  # koşmamış bir değişiklik main'e girdikten sonra ilk kez orada kırmızı olur.
  # Makefile listede çünkü e2e işi `make demo-seed` çağırıyor — yani Makefile artık bir CI
  # bağımlılığı. scripts/** savunma amaçlı: CI scripts/e2e.sh'ı koşmuyor ama dokümante
  # edilen `make e2e` girişi CI görmeden kaymasın.
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - 'Makefile'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - 'Makefile'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend # Go modülü backend/ altında

    # SERVİS KONTEYNERLERİ: iş boyunca yanımızda çalışan gerçek Postgres ve Redis.
    # Entegrasyon testleri TEST_DATABASE_URL / TEST_REDIS_URL görünce atlanmaz, gerçekten koşar.
    # Parola yok (trust): konteyner yalnız bu iş boyunca, yalnız bu runner'da yaşar; kaynakta parola
    # gibi duran bir değer de kalmaz.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bookhub
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: bookhub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bookhub -d bookhub_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://bookhub@localhost:5432/bookhub_test?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod # sürümü go.mod'dan al (senkron kalsın)
          cache-dependency-path: backend/go.sum

      - name: Format check (gofmt)
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "Bu dosyalar gofmt gerektiriyor:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # -race + gerçek DB: eşzamanlılık testleri (FOR UPDATE, tek kullanımlık token, 25
      # eşzamanlı oy) burada gerçekten koşar — lokal "benim makinemde geçiyor"un sigortası.
      - name: Test (race, Postgres + Redis entegrasyonu dahil)
        run: go test -race -count=1 ./...

      # golangci-lint (kalite/bug linter — ESLint'in Go karşılığı) — otoriter backstop.
      # Sürüm reproducibility için pinlendi (lokal sürüm ufak farklı olabilir; otorite CI'dır).
      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: backend

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Lock dosyasına BİREBİR sadık kurulum; --ignore-scripts: bağımlılıkların kurulum betikleri
      # çalışmaz (ele geçirilmiş bir paketin en kolay kod çalıştırma yolu). Araçlar npx değil
      # projenin betikleriyle koşar: sürüm lock'tan gelir, hiçbir şey indirilmez.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run bundle

  # Yayınlanan İKİ imajı derleyip bilinen açıklara (CVE) karşı tara. Derleme aşamalarındaki
  # paketler (node, npm, golang) son imaja girmez; taranan şey gerçekten dağıtılan içeriktir.
  # Kural `make scan` ile aynı: HIGH/CRITICAL ve DÜZELTMESİ OLAN bir açık → iş kırmızı.
  # ignore-unfixed: dağıtımın henüz yama yayınlamadığı açık için yapacak bir şey yok; onunla
  # kırılmak gürültü olurdu. Action, commit SHA'sıyla sabitlendi (etiket taşınabilir, SHA taşınamaz).
  # Aynı kural scan.yml'de haftalık olarak canlıdaki kod (release) üzerinde koşar; ikisi birlikte değişir.
  images:
    name: İmaj taraması (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the published images
        id: build
        run: |
          docker build -t bookhub-api:dev backend
          docker build -t bookhub-web:dev frontend
      # İKİ İMAJ DA HER ZAMAN TARANIR (#48): eskiden api kırılınca web adımı atlanıyordu ve nginx'in
      # üç açığı bu yüzden CI'da görünmedi. Şimdi web de koşar, bulgusu logda görünür; iş yine kırmızı
      # biter (adım atlanmaz, continue-on-error yok). Koşul yalnız derlemenin başarısına bakar.
      - name: Scan bookhub-api (Trivy)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bookhub-api:dev
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Scan bookhub-web (Trivy)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bookhub-web:dev
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  e2e:
    name: E2E (compose + MVP smoke + Playwright)
    needs: [backend]
    runs-on: ubuntu-latest

    # İŞ SEVİYESİNDE, yani `docker compose up` bunu görsün: API'nin IP başına auth sınırı
    # varsayılan 10/dk ve Playwright senaryoları tek IP'den bir dizi giriş yapıyor.
    # (NGINX'in login|register kovası imajın içinde; o yükseltilemez — testler onun
    # bütçesine göre yazıldı, bkz. frontend/e2e/helpers.ts.)
    env:
      AUTH_RATE_LIMIT_PER_MIN: "1000"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # JWT secret'ı dosyaya YAZMIYORUZ: her koşuda rastgele üretilir, iş bitince yok olur.
      - name: Generate throwaway JWT secret
        run: echo "JWT_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"

      # Aynı docker-compose.yml, lokalde kullandığımız: imajı derler, Postgres + Redis + API'yi
      # kaldırır; --wait tüm healthcheck'ler yeşillenene kadar bekler.
      - name: Start the stack
        run: docker compose --profile app up -d --build --wait

      - name: MVP Definition of Done (smoke)
        env:
          API: http://localhost:8080
          DATABASE_URL: postgres://bookhub:bookhub_dev@localhost:5432/bookhub?sslmode=disable
        run: backend/scripts/mvp_smoke.sh

      # Yükseltilmiş sınır KONTEYNERE GERÇEKTEN geçti mi? compose, env değiştiğinde
      # konteyneri yeniden oluşturur — ama bir gün oluşturmazsa (ya da değişkenin adı
      # değişirse) testler sebebi anlaşılmaz 429'larla düşerdi. Burada, açık bir mesajla ölsün.
      - name: Verify the API got the raised auth rate limit
        run: |
          docker inspect bookhub-api --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | grep -qx 'AUTH_RATE_LIMIT_PER_MIN=1000'

      # Playwright senaryoları demo katalogla konuşuyor ("Dune", "Vakıf", türler).
      - name: Demo catalog (Playwright fixtures)
        run: make demo-seed

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: ./frontend
        run: npm ci --ignore-scripts

      # --only-shell: yalnız chromium-headless-shell (tam chromium değil; playwright.config.ts
      # bu yüzden `devices['Desktop Chrome']` kullanmıyor). --with-deps: runner'a eksik
      # sistem kütüphanelerini kurar.
      - name: Install chromium (headless shell)
        working-directory: ./frontend
        run: npm run e2e:browsers -- --with-deps

      # Admin parolası rastgele ve TEK STEP içinde kalır: $GITHUB_ENV'e yazılsaydı işin geri
      # kalan tüm adımlarına sızardı. ::add-mask:: ile de log'da yıldızlanıyor.
      - name: Playwright (real browser E2E)
        working-directory: ./frontend
        env:
          E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          E2E_ADMIN_EMAIL="e2e-admin-$E2E_RUN_ID@example.com"
          E2E_ADMIN_PASSWORD="$(openssl rand -base64 24)"
          echo "::add-mask::$E2E_ADMIN_PASSWORD"
          export E2E_ADMIN_EMAIL E2E_ADMIN_PASSWORD
          printf '%s\n' "$E2E_ADMIN_PASSWORD" \
            | docker exec -i bookhub-api /app/manage create-admin -email "$E2E_ADMIN_EMAIL" -name "E2E Admin"
          npm run e2e

      # YALNIZ hata durumunda: rapor ve trace'ler çerez/parola içerir, her yeşil koşuda
      # saklamanın anlamı yok. Kısa saklama süresi aynı gerekçenin devamı.
      - name: Upload the Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 5

      - name: Container logs (on failure)
        if: failure()
        run: docker compose --profile app logs
