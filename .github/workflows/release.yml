# Release — API imajını GitHub Container Registry'ye (ghcr.io) yayınlar.
#
# BİLEREK her push'ta DEĞİL: yalnızca "v*" biçiminde bir git etiketi (ör. v1.0.0) GitHub'a
# gönderildiğinde ya da Actions sekmesinden elle ("Run workflow"). İmaj yayınlamak dışarıya
# dönük bir eylem; ne zaman olacağına sen karar ver.
#
# Kimlik: GITHUB_TOKEN (Actions'ın her koşuya verdiği kısa ömürlü token) — ek bir sır yok.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # yalnızca bu iş akışı ghcr.io'ya yazabilir

jobs:
  image:
    name: Build & push API image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Etiketler: git etiketi (v1.2.3 → 1.2.3) + commit sha — "hangi koddan derlendi?"
      # sorusu imaj adından cevaplanabilsin.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/bookhub-api
          tags: |
            type=semver,pattern={{version}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
