# SonarCloud otomatik analizinin ayarları (kök dizindeki bu dosyayı kendisi okur).
#
# demo_seed.sql tohum verisi: kitap, yazar ve tür adları doğal olarak tekrarlanır ve
# "tekrarlanan metni sabite çevir" bulgusu üretir. Sonar PR başına en çok 50 bulguyu GitHub'a
# yazdığı için bu gürültü gerçek bulguları listeden itiyordu.
sonar.exclusions=backend/scripts/demo_seed.sql

# sqlc'nin ÜRETTİĞİ kod (backend/internal/db): elle yazılmaz, `sqlc generate` ile yeniden üretilir.
# Aynı kolonları okuyan sorgular için sqlc aynı Scan bloklarını üretir; Sonar bunları tekrar sayıp
# yeni koddaki tekrar kapısını (≤ %3) düşürüyordu (PR #73: library.sql.go ve ratings.sql.go %90).
# Kaynakta düzeltilecek bir şey yok. Yalnız TEKRAR ölçümünden çıkarılır; dosyalar analizde kalır.
sonar.cpd.exclusions=backend/internal/db/**
