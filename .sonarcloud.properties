# SonarCloud otomatik analizinin ayarları (kök dizindeki bu dosyayı kendisi okur).
#
# demo_seed.sql tohum verisi: kitap, yazar ve tür adları doğal olarak tekrarlanır ve
# "tekrarlanan metni sabite çevir" bulgusu üretir. Sonar PR başına en çok 50 bulguyu GitHub'a
# yazdığı için bu gürültü gerçek bulguları listeden itiyordu.
sonar.exclusions=backend/scripts/demo_seed.sql

# Veri migration'ları (Faz 16, PR #73): 0009 ve 0012 kitap başına bir satırlık VALUES listeleri. Sonar
# tekrar ararken metin değerlerini aynı simgeye indirgediği için aynı şekildeki satırları birbirinin
# kopyası sayıyor ve yeni koddaki tekrar kapısını (≤ %3) düşürüyordu. Yalnız TEKRAR ölçümünden çıkarılır;
# dosyalar analizde kalır (güvenlik ve hata bulguları taranmaya devam eder).
sonar.cpd.exclusions=backend/migrations/0009_demo_book_covers.sql,backend/migrations/0012_demo_editions.sql
